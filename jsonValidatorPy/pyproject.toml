[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ods-validador"
version = "0.1.0"
description = "Validador de mensagens do barramento ODS 2026/2 (JSON Schemas da Especificação 1.0)"
requires-python = ">=3.10"
# format-nongpl liga a checagem real de "date-time" e "uuid"
dependencies = ["jsonschema[format-nongpl]>=4.20"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ods-validar = "ods_validador.__main__:main"

# Os arquivos ficam soltos em src/; instalam como o pacote "ods_validador".
[tool.setuptools]
packages = ["ods_validador"]

[tool.setuptools.package-dir]
ods_validador = "src"

# _schemas/ é gerada pelo setup.py a partir do repositório b1 (não vai ao git)
[tool.setuptools.package-data]
ods_validador = ["_schemas/**/*.json"]
